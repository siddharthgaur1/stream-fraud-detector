services:
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm trainer` before first `docker compose up`.
  trainer:
    build: .
    profiles: ["tools"]
    command: sh -c "python -m training.generate_data && python -m training.train"
    volumes:
      - ./models:/models
      - ./data:/app/data

  producer:
    build: .
    command: python -m producer.main
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092

  scorer:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
      MODEL_DIR: /models
      REPORTS_DIR: /reports
    volumes:
      - ./models:/models:ro
      - ./reports:/reports

  monitor:
    build: .
    command: python -m monitor.main
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
      MODEL_DIR: /models
      REPORTS_DIR: /reports
    volumes:
      - ./models:/models:ro
      - ./reports:/reports

volumes:
  pgdata:
