name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # No broker, no Redis, no Postgres. These cover feature computation,
      # ensemble scoring, the auth/rate-limit path and the drift trigger,
      # all exercised against fakes.
      - run: pytest
        env:
          PYTHONPATH: .

  train-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train on a small synthetic sample
        env:
          PYTHONPATH: .
        run: |
          python -m training.generate_data --n-users 50 --tx-per-user 30 --out data/transactions.csv
          python -m training.train --data data/transactions.csv --out models/model.joblib
      - name: Bundle carries the ensemble weights
        # Regression guard: the weight and threshold used to live only in the
        # environment, so a deploy-time override silently invalidated the
        # drift reference computed at training time.
        run: |
          python - <<'PY'
          import joblib
          # Loads the artifact the previous step just produced in this job.
          b = joblib.load("models/model.joblib")
          assert "xgb_weight" in b and "threshold" in b, sorted(b)
          print("bundle keys ok:", sorted(b))
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  build:
    needs: [lint, test, train-smoke, compose-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Push only from the default branch: a pull_request from a fork has no
        # write token, and publishing an image built from unreviewed code is
        # not something CI should do on its own.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image must not run as root
        run: |
          docker build -t ci-rootcheck .
          UID_IN_IMAGE=$(docker run --rm --entrypoint id ci-rootcheck -u)
          echo "container uid: $UID_IN_IMAGE"
          test "$UID_IN_IMAGE" != "0"
